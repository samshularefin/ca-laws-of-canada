plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diasoft.calaws'
    compileSdk 35

    defaultConfig {
        applicationId "com.diasoft.calaws"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        resValues true
    }

    buildTypes {
        // Debug builds use Google's test ads: tapping your own real ads can get an AdMob account suspended.
        debug {
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "banner_ad_unit_id", "ca-app-pub-3940256099942544/6300978111"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8585939903020301~9539740758"]
            resValue "string", "banner_ad_unit_id", "ca-app-pub-8585939903020301/8797504726"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
}
